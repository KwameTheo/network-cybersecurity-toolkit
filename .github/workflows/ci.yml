name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ========================================================
  # Stage 1: Automated Unit Test Suite (Matrix Testing)
  # ========================================================
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite (94 Tests across 17 Modules)
        run: |
          python -m unittest discover tests -v

  # ========================================================
  # Stage 2: Standalone Windows Binary Build & Artifact Export
  # ========================================================
  build:
    name: Build Standalone Windows Binary
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Standalone Executable via PyInstaller
        run: |
          pyinstaller --noconfirm NetSec_Toolkit.spec

      - name: Package Release ZIP Archive
        shell: powershell
        run: |
          Compress-Archive -Path "dist\NetSec_Toolkit\*" -DestinationPath "dist\NetSec_Toolkit_Windows_x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetSec_Toolkit_Windows_x64
          path: dist/NetSec_Toolkit_Windows_x64.zip
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NetSec_Toolkit_Windows_x64.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
